# Dev environment. PhpStorm: Settings → PHP → CLI Interpreter → From Docker Compose → service "php",
# then PHP → Test Frameworks → PHPUnit by Remote Interpreter (composer autoloader: /app/vendor/autoload.php).
#
# The ingot library is consumed through a composer *path* repository (../ingot). Composer writes a
# relative symlink vendor/ingot/ingot -> ../../../ingot, so the library checkout must sit next to
# this project on the host AND be mounted at /ingot in the container (same depth relative to /app).
services:
  php:
    build: docker
    image: ingot-forms-dev
    working_dir: /app
    # `docker compose up` serves the API on http://localhost:8000 (dev server).
    # `docker compose run` (Makefile, PhpStorm) overrides this command, and
    # the port is only published by `up`, so tool runs never conflict.
    command: php -S 0.0.0.0:8000 -t public
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ../ingot:/ingot:ro
    # A ceiling for everything that runs in here — the browser suite most of all,
    # because Chrome spawns a process per tab and per renderer and will happily
    # take every core on the machine. The tests are allowed to be slower; the
    # machine they run on is not allowed to stutter. Raise it for a build box:
    # DOCKER_CPUS=12 DOCKER_MEMORY=8g docker compose up -d
    cpus: ${DOCKER_CPUS:-4}
    mem_limit: ${DOCKER_MEMORY:-3g}
    environment:
      DATABASE_URL: "postgresql://app:app@postgres:5432/ingot_forms?serverVersion=17&charset=utf8"
      # Merged with Panther's own arguments, not replacing them. `dev-shm-usage`
      # is the one that matters in a container (the default /dev/shm is 64 MB and
      # Chrome crashes rather than slows); the rest is appetite it does not need
      # for a form: no GPU, few renderers, no background chatter.
      PANTHER_CHROME_ARGUMENTS: >-
        --disable-dev-shm-usage --disable-gpu --renderer-process-limit=2
        --disable-extensions --disable-background-networking
        --disable-backgrounding-occluded-windows --mute-audio
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: ingot_forms
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ingot_forms"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
