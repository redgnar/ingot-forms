parameters:
    # Where uploaded bytes live. A directory is one node: more than one instance
    # needs a shared volume, or an S3-style Flysystem adapter — configuration
    # either way, never code.
    files.default_dir: '%kernel.project_dir%/var/storage/files'
    files.dir: '%env(default:files.default_dir:FILES_DIR)%'
    # What this deployment accepts per upload, and how many files one form may
    # hold. The first must stay at or below what docker/php.ini allows, and at or
    # above the largest maxSize any definition served here asks for.
    files.max_upload: '%env(int:default:files.default_max_upload:FILES_MAX_UPLOAD)%'
    files.default_max_upload: 10485760
    files.per_form: '%env(int:default:files.default_per_form:FILES_PER_FORM)%'
    files.default_per_form: 50

services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        # A kit that can draw forms announces itself by implementing the
        # interface: adding one is adding a class, never editing a list.
        App\Domain\Forms\Presentation\Engine\PresentationEngine:
            tags: ['app.presentation_engine']

        # A kit that can actually draw one announces itself the same way.
        App\UserInterface\Web\Renderer\FormRenderer:
            tags: ['app.form_renderer']

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            # the model itself: an aggregate, its data objects and its exceptions
            - '../src/Domain/Forms/{Definition,Event,Exception,ValueObject}/'
            - '../src/Domain/Forms/Presentation/{PresentationDocument,Section,PresentedItem}.php'
            - '../src/Domain/Forms/Presentation/Rule/'
            - '../src/Domain/Forms/{Form,FormStatus,DeriveMode}.php'
            - '../src/Infrastructure/Persistence/FormRecord.php'
            - '../src/UserInterface/Api/Problem/ProblemException.php'
            # an upload on its way in, and an open file on its way out
            - '../src/Application/Forms/File/'
            - '../src/Application/Forms/Exception/'
            - '../src/UserInterface/Web/Renderer/RenderedForm.php'
            # request DTOs and the attributes/constraints describing them
            - '../src/UserInterface/Api/Request/{CreateFormRequest,DataSchemaQuery,SaveFormDataRequest}.php'
            - '../src/UserInterface/Api/Request/Constraint/{ValidFormDefinition,ViolationPointer}.php'

    # The definition mapper is configuration, not a consumer's private detail:
    # one named service, built by a domain factory, injected where it is needed.
    forms.definition_mapper:
        class: Ingot\TreeMapper
        factory: ['@App\Domain\Forms\FormMapperFactory', 'create']

    App\Domain\Forms\FormMapperFactory:
        arguments:
            $metadataCache: '@cache.ingot_mapper'

    App\Domain\Forms\FormDefinitionProcessor:
        arguments:
            $mapper: '@forms.definition_mapper'

    App\Domain\Forms\PresentationProcessor:
        arguments:
            $mapper: '@forms.definition_mapper'

    App\Domain\Forms\Presentation\Engine\Engines:
        arguments:
            $engines: !tagged_iterator app.presentation_engine

    App\UserInterface\Web\Renderer\Renderers:
        arguments:
            $renderers: !tagged_iterator app.form_renderer

    # Ports, and the adapters that fill them. Nothing above the application
    # layer names an implementation.
    App\Domain\Forms\Port\FormRepository: '@App\Infrastructure\Persistence\DoctrineFormRepository'
    App\Domain\Forms\Port\DefinitionParser: '@App\Domain\Forms\FormDefinitionProcessor'
    App\Domain\Forms\Port\PresentationParser: '@App\Domain\Forms\PresentationProcessor'
    App\Domain\Forms\Port\ValuesValidator: '@App\Infrastructure\Validation\StagedValuesValidator'
    App\Application\Forms\Port\Transactions: '@App\Infrastructure\Persistence\DoctrineTransactions'
    App\Application\Forms\Port\DataSchemas: '@App\Infrastructure\Cache\CachedDataSchemaProvider'
    App\Application\Forms\Port\FileStore: '@App\Infrastructure\Files\FlysystemFileStore'

    App\Infrastructure\Files\FlysystemFileStore:
        arguments:
            $storage: '@forms.files.storage'

    App\Application\Forms\UseCase\UploadFormFile:
        arguments:
            $budget: '%files.per_form%'
            $maxUpload: '%files.max_upload%'

    App\Infrastructure\Cache\CachedDataSchemaProvider:
        arguments:
            $pool: '@cache.data_schema'

