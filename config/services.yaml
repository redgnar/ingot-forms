parameters:
    # Where uploaded bytes live. A directory is one node: more than one instance
    # needs a shared volume, or an S3-style Flysystem adapter — configuration
    # either way, never code.
    files.default_dir: '%kernel.project_dir%/var/storage/files'
    files.dir: '%env(default:files.default_dir:FILES_DIR)%'
    # What this deployment accepts per upload, and how many files one form may
    # hold. The first must stay at or below what docker/php.ini allows, and at or
    # above the largest maxSize any definition served here asks for.
    files.max_upload: '%env(int:default:files.default_max_upload:FILES_MAX_UPLOAD)%'
    files.default_max_upload: 10485760
    files.per_form: '%env(int:default:files.default_per_form:FILES_PER_FORM)%'
    files.default_per_form: 50
    # How long a file nobody saved may sit before app:files:purge-temporary takes
    # it. Days rather than minutes, so it cannot race somebody who is still
    # filling a form in.
    files.temporary_days: '%env(int:default:files.default_temporary_days:FILES_TEMPORARY_DAYS)%'
    files.default_temporary_days: 7
    # How many saves of one form the history keeps. Every draft is a whole values
    # document, and everything that asks what a form has *ever* named reads all of
    # them, so an unbounded history is an unbounded cost. When a save pushes a form
    # past this, its oldest one leaves. 0 keeps every save there has ever been.
    forms.default_history_limit: 100
    forms.history_limit: '%env(int:default:forms.default_history_limit:FORMS_HISTORY_LIMIT)%'
    # Who a save is attributed to when the gateway asserted nobody. Unset means
    # *refuse* rather than fall back: a form that records who fills it in cannot
    # accept a save naming nobody, which is what makes a proxy that quietly
    # stopped asserting visible instead of filling the column with a placeholder
    # for months. A deployment that does not want the check sets this — to
    # something reserved and obviously not a person, so a row saying "nobody told
    # us" reads as a fact rather than as somebody's name.
    forms.identity_fallback: '%env(default::FORMS_IDENTITY_FALLBACK)%'

    # What a form is dressed in when its own presentation names no skin. The
    # document wins where it says something; this is what re-dresses every form
    # that says nothing, without touching a single stored document. It must be a
    # skin the kit has, and the renderer refuses to be built otherwise.
    forms.default_skin: 'default'
    forms.skin: '%env(default:forms.default_skin:FORMS_SKIN)%'

    # Where this deployment serves the pages' own JavaScript and CSS from. It is
    # a prefix rather than a directory: AssetMapper writes the compiled files
    # under it and generates every URL from it, so one value moves them together.
    # Two reasons it is configurable at all, and both are somebody else's
    # deployment rather than ours: several of these services behind one host need
    # prefixes that do not collide, and a deployment serving its static files from
    # a CDN or a bucket sets an absolute URL here (then the store needs CORS —
    # a module fetched cross-origin without it is refused by the browser with a
    # perfectly good 200).
    forms.default_assets_prefix: '/assets/'
    forms.assets_prefix: '%env(default:forms.default_assets_prefix:FORMS_ASSETS_PREFIX)%'

    # Where the queue that carries the delivery nudge lives. Doctrine by default,
    # so a plain installation needs no broker; a deployment with one changes the
    # DSN and nothing else ({@see config/packages/messenger.yaml}).
    messenger.default_dsn: 'doctrine://default'

    # What signs a notification. There is no default and there cannot be one: an
    # unsigned "this form was confirmed" is forgeable by anything that can reach
    # the receiver, and a receiver cannot tell the forged ones apart afterwards.
    # A form that names an endpoint while this is unset is refused rather than
    # told about unsigned.
    forms.webhook.secret: '%env(string:default::FORMS_WEBHOOK_SECRET)%'
    # How long a receiver has to answer, and how many refusals one announcement
    # gets before this service stops trying and leaves it where somebody can see
    # it.
    forms.webhook.default_timeout: 5
    forms.webhook.timeout: '%env(int:default:forms.webhook.default_timeout:FORMS_WEBHOOK_TIMEOUT)%'
    forms.webhook.default_attempts: 12
    forms.webhook.attempts: '%env(int:default:forms.webhook.default_attempts:FORMS_WEBHOOK_ATTEMPTS)%'

when@test:
    parameters:
        # The suites need somebody to be. Every fixture creates its forms the way
        # a client would — without saying anything about identity, so `recorded` —
        # and this is what lets them go on saving *and* makes every one of them
        # exercise the path that writes an actor. The refusal that happens with no
        # fallback is pinned in the unit suite instead, against the aggregate,
        # where Infection runs.
        forms.identity_fallback: 'test-suite'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        # A kit that can draw forms announces itself by implementing the
        # interface: adding one is adding a class, never editing a list.
        App\Domain\Forms\Presentation\Engine\PresentationEngine:
            tags: ['app.presentation_engine']

        # A kit that can actually draw one announces itself the same way.
        App\UserInterface\Web\Renderer\FormRenderer:
            tags: ['app.form_renderer']

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            # the model itself: an aggregate, its data objects and its exceptions
            - '../src/Domain/Forms/{Definition,Event,Exception,ValueObject}/'
            - '../src/Domain/Forms/Presentation/{PresentationDocument,PresentedItem}.php'
            - '../src/Domain/Forms/Presentation/Rule/'
            - '../src/Domain/Forms/{Form,FormStatus,DeriveMode}.php'
            - '../src/Infrastructure/Persistence/{FormRecord,FormRevisionRecord}.php'
            - '../src/UserInterface/Api/Problem/ProblemException.php'
            # an upload on its way in, and an open file on its way out
            # values, unlike FormFiles beside them
            - '../src/Application/Forms/File/{IncomingFile,FileStream,CollectedFiles}.php'
            - '../src/Application/Forms/History/'
            # what happened, one waiting to be told, and what a run did — values,
            # not services
            - '../src/Application/Forms/Webhook/'
            - '../src/Application/Forms/Exception/'
            - '../src/UserInterface/Web/Renderer/RenderedForm.php'
            # the resolved tree a template draws: value objects, not services
            - '../src/UserInterface/Web/Renderer/Node/'
            # request DTOs and the attributes/constraints describing them
            - '../src/UserInterface/Api/Request/{CreateFormRequest,DataSchemaQuery,SaveFormDataRequest}.php'
            - '../src/UserInterface/Api/Request/Constraint/{ValidFormDefinition,ViolationPointer}.php'

    # The two values that say where this installation put the service. Neither is
    # knowledge the code may hold: an address written into a template or a script
    # is an address that stops being true the moment somebody mounts this
    # elsewhere.
    App\UserInterface\Cli\RouteGroupsCommand:
        arguments:
            $basePath: '%forms.base_path%'
            $assetsPrefix: '%forms.assets_prefix%'

    App\UserInterface\Web\Renderer\BootstrapRenderer:
        arguments:
            $defaultSkin: '%forms.skin%'

    # The definition mapper is configuration, not a consumer's private detail:
    # one named service, built by a domain factory, injected where it is needed.
    forms.definition_mapper:
        class: Ingot\TreeMapper
        factory: ['@App\Domain\Forms\FormMapperFactory', 'create']

    App\Domain\Forms\FormMapperFactory:
        arguments:
            $metadataCache: '@cache.ingot_mapper'

    App\Domain\Forms\FormDefinitionProcessor:
        arguments:
            $mapper: '@forms.definition_mapper'

    App\Domain\Forms\PresentationProcessor:
        arguments:
            $mapper: '@forms.definition_mapper'

    App\Domain\Forms\Presentation\Engine\Engines:
        arguments:
            $engines: !tagged_iterator app.presentation_engine

    App\UserInterface\Web\Renderer\Renderers:
        arguments:
            $renderers: !tagged_iterator app.form_renderer

    # Ports, and the adapters that fill them. Nothing above the application
    # layer names an implementation.
    App\Domain\Forms\Port\FormRepository: '@App\Infrastructure\Persistence\DoctrineFormRepository'
    App\Domain\Forms\Port\DefinitionParser: '@App\Domain\Forms\FormDefinitionProcessor'
    App\Domain\Forms\Port\PresentationParser: '@App\Domain\Forms\PresentationProcessor'
    App\Domain\Forms\Port\ValuesValidator: '@App\Infrastructure\Validation\StagedValuesValidator'
    App\Application\Forms\Port\Transactions: '@App\Infrastructure\Persistence\DoctrineTransactions'
    App\Application\Forms\Port\Announcements: '@App\Infrastructure\Persistence\DoctrineAnnouncements'
    App\Application\Forms\Port\Announcer: '@App\Infrastructure\Webhook\MessengerAnnouncer'
    App\Application\Forms\Port\Webhook: '@App\Infrastructure\Webhook\SignedHttpWebhook'
    App\Application\Forms\Port\DataSchemas: '@App\Infrastructure\Cache\CachedDataSchemaProvider'
    App\Application\Forms\Port\FileStore: '@App\Infrastructure\Files\FlysystemFileStore'
    App\Application\Forms\Port\FormHistory: '@App\Infrastructure\Persistence\DoctrineFormHistory'

    App\Infrastructure\Persistence\DoctrineFormRepository:
        arguments:
            $historyLimit: '%forms.history_limit%'

    App\Infrastructure\Files\FlysystemFileStore:
        arguments:
            $storage: '@forms.files.storage'

    App\Application\Forms\UseCase\UploadFormFile:
        arguments:
            $budget: '%files.per_form%'
            $maxUpload: '%files.max_upload%'

    App\Application\Forms\UseCase\PurgeTemporaryFiles:
        arguments:
            $days: '%files.temporary_days%'

    App\Application\Forms\UseCase\DeliverAnnouncements:
        arguments:
            $attempts: '%forms.webhook.attempts%'

    App\Infrastructure\Webhook\SignedHttpWebhook:
        arguments:
            $secret: '%forms.webhook.secret%'
            $timeout: '%forms.webhook.timeout%'

    App\Infrastructure\Cache\CachedDataSchemaProvider:
        arguments:
            $pool: '@cache.data_schema'

