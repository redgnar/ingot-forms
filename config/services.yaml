services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            # data objects and exceptions, not services
            - '../src/Domain/Forms/Definition/'
            - '../src/Domain/Forms/{DefinitionNotValid,FormDataNotValid,DeriveMode}.php'
            - '../src/Infrastructure/Persistence/{FormRecord,FormListItem,FormStatus,FormNotFound,FormGone}.php'
            - '../src/Http/Problem/ProblemException.php'

    App\Domain\Forms\FormDefinitionProcessor:
        arguments:
            $mapperCache: '@cache.ingot_mapper'

    App\Infrastructure\Cache\CachedDataSchemaProvider:
        arguments:
            $pool: '@cache.data_schema'

# The default HttpKernel logger prints to the test output, which PHPUnit's
# beStrictAboutOutputDuringTests rightly flags — silence it in tests.
when@test:
    services:
        logger:
            class: Psr\Log\NullLogger
