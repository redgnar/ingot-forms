services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            # the model itself: an aggregate, its data objects and its exceptions
            - '../src/Domain/Forms/{Definition,Event,Exception,ValueObject}/'
            - '../src/Domain/Forms/{Form,FormStatus,DeriveMode}.php'
            - '../src/Infrastructure/Persistence/FormRecord.php'
            - '../src/UserInterface/Http/Problem/ProblemException.php'
            # request DTOs and the attributes/constraints describing them
            - '../src/UserInterface/Http/Request/{CreateFormRequest,DataSchemaQuery,SaveFormDataRequest}.php'
            - '../src/UserInterface/Http/Request/Constraint/{ValidFormDefinition,ViolationPointer}.php'

    # The definition mapper is configuration, not a consumer's private detail:
    # one named service, built by a domain factory, injected where it is needed.
    forms.definition_mapper:
        class: Ingot\TreeMapper
        factory: ['@App\Domain\Forms\FormMapperFactory', 'create']

    App\Domain\Forms\FormMapperFactory:
        arguments:
            $metadataCache: '@cache.ingot_mapper'

    App\Domain\Forms\FormDefinitionProcessor:
        arguments:
            $mapper: '@forms.definition_mapper'

    # Ports, and the adapters that fill them. Nothing above the application
    # layer names an implementation.
    App\Domain\Forms\Port\FormRepository: '@App\Infrastructure\Persistence\DoctrineFormRepository'
    App\Domain\Forms\Port\DefinitionParser: '@App\Domain\Forms\FormDefinitionProcessor'
    App\Domain\Forms\Port\ValuesValidator: '@App\Infrastructure\Validation\StagedValuesValidator'
    App\Application\Forms\Port\Transactions: '@App\Infrastructure\Persistence\DoctrineTransactions'
    App\Application\Forms\Port\DataSchemas: '@App\Infrastructure\Cache\CachedDataSchemaProvider'

    App\Infrastructure\Cache\CachedDataSchemaProvider:
        arguments:
            $pool: '@cache.data_schema'

# The default HttpKernel logger prints to the test output, which PHPUnit's
# beStrictAboutOutputDuringTests rightly flags — silence it in tests.
when@test:
    services:
        logger:
            class: Psr\Log\NullLogger
