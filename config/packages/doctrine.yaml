doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        types:
            uuid: Symfony\Bridge\Doctrine\Types\UuidType
    orm:
        # Nothing platform-specific is mapped: columns use portable Doctrine types
        # and the documents are stored as the exact JSON text the engine validated,
        # so the same mapping runs on PostgreSQL, MySQL/MariaDB or SQLite.
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        validate_xml_mapping: true
        controller_resolver:
            auto_mapping: false
        mappings:
            Forms:
                # XML, not attributes: the aggregate is domain code and says
                # nothing about how it is stored.
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/config/doctrine'
                prefix: 'App\Domain\Forms'
                alias: Forms
