framework:
    secret: '%env(APP_SECRET)%'
    # Which language a page is drawn in is the framework's own negotiation: a
    # `?lang=` the reader asked for wins (PageLocaleListener puts it in the
    # `_locale` attribute, which is where the framework looks), otherwise
    # Accept-Language decides, and this is the last word. The locale is not in
    # the path — one shape per address is what lets a gateway rule be one line.
    # The API is untouched by any of it: it serves codes and never resolves a
    # language.
    default_locale: en
    set_locale_from_accept_language: true
    http_method_override: false
    # Where the proxy in front of this service is, and therefore whose asserted
    # headers may be believed at all. Unset means none — and then
    # `X-Forms-Identity` is ignored entirely, which is the safe direction: a form
    # that records who fills it in refuses every save until a deployment says
    # where its proxy is, rather than trusting a header any client could send.
    # Rows written under a forgeable header can never be repaired or even told
    # apart from the good ones, which is why this one is not optional.
    trusted_proxies: '%env(default::FORMS_TRUSTED_PROXIES)%'
    # The framework's own four, plus the one that says where this service was
    # reached from: a gateway that answers on `/somewhere/forms/{id}`, strips
    # `/somewhere` and sends it in `X-Forwarded-Prefix` gets every generated
    # address — pages, assets, the endpoints the page hands its own JavaScript —
    # under that prefix, with nothing configured here. Like the identity header it
    # counts only from a trusted proxy, and for the same reason: it changes what
    # this service says about itself.
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']
    handle_all_throwables: true
    # Request envelopes are mapped and validated by Symfony (#[MapRequestPayload],
    # #[MapQueryString] + Assert attributes on the DTOs in
    # src/UserInterface/Api/Request/).
    validation:
        enable_attributes: true
    # Values are validated by a Symfony form built from the form's own definition
    # (src/Infrastructure/Validation/). No sessions and no browser here, so no
    # CSRF token.
    form:
        csrf_protection:
            enabled: false
    serializer:
        enable_attributes: true
    php_errors:
        log: true
    router:
        utf8: true
    # The pages' own JavaScript and CSS: mapped from `assets/`, imported by name
    # in the browser, no build step. Only the `bootstrap` kit uses it.
    asset_mapper:
        paths:
            - assets/
        # Not the default `/assets/` but the same value said once, so a deployment
        # can move the static files without touching a template: FORMS_ASSETS_PREFIX.
        public_prefix: '%forms.assets_prefix%'
    # What a page says in its own name — that a draft was stored, that a form is
    # closed, that something went wrong — in the language the request negotiated.
    # The form's own text is never here: it travels as codes in the presentation.
    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks: ['en']
    cache:
        pools:
            # ingot mapper metadata — keys derive from class names only
            cache.ingot_mapper: ~
            # derived data schemas, keyed by immutable form UUID and mode
            cache.data_schema: ~

# Both pools hold something *derived by this code*, and their keys say nothing
# about the code that derived it: a form UUID and a class name both outlive a
# changed rule. On a deploy they are cleared (`make cache-clear`); while
# developing, clearing them by hand is a rule waiting to be forgotten, so
# nothing is kept past the process that derived it.
when@dev:
    framework:
        cache:
            pools:
                cache.ingot_mapper:
                    adapter: cache.adapter.array
                cache.data_schema:
                    adapter: cache.adapter.array

when@test:
    framework:
        test: true
        # The test client *is* the proxy here, so the identity intake has
        # something to believe. Without this every suite would run with the
        # header ignored, and the one path that matters would be the one path
        # nothing exercises.
        trusted_proxies: '127.0.0.1'
