framework:
    secret: '%env(APP_SECRET)%'
    # Which language a page is drawn in is the framework's own negotiation: an
    # explicit `_locale` in the URL wins, otherwise Accept-Language decides, and
    # this is the last word. The API is untouched by it — it serves codes and
    # never resolves a language.
    default_locale: en
    set_locale_from_accept_language: true
    http_method_override: false
    handle_all_throwables: true
    # Request envelopes are mapped and validated by Symfony (#[MapRequestPayload],
    # #[MapQueryString] + Assert attributes on the DTOs in src/Http/Request/).
    validation:
        enable_attributes: true
    # Values are validated by a Symfony form built from the form's own definition
    # (src/Http/Form/). No sessions and no browser here, so no CSRF token.
    form:
        csrf_protection:
            enabled: false
    serializer:
        enable_attributes: true
    php_errors:
        log: true
    router:
        utf8: true
    # The pages' own JavaScript and CSS: mapped from `assets/`, imported by name
    # in the browser, no build step. Only the `bootstrap` kit uses it.
    asset_mapper:
        paths:
            - assets/
    cache:
        pools:
            # ingot mapper metadata — keys derive from class names only
            cache.ingot_mapper: ~
            # derived data schemas, keyed by immutable form UUID and mode
            cache.data_schema: ~

# Both pools hold something *derived by this code*, and their keys say nothing
# about the code that derived it: a form UUID and a class name both outlive a
# changed rule. On a deploy they are cleared (`make cache-clear`); while
# developing, clearing them by hand is a rule waiting to be forgotten, so
# nothing is kept past the process that derived it.
when@dev:
    framework:
        cache:
            pools:
                cache.ingot_mapper:
                    adapter: cache.adapter.array
                cache.data_schema:
                    adapter: cache.adapter.array

when@test:
    framework:
        test: true
