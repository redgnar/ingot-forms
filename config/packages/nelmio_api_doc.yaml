# The API contract is generated from the code: routes, the request DTOs behind
# #[MapRequestPayload]/#[MapQueryString] (with their Assert constraints and
# #[OA\Property] prose), and the #[OA\Response] attributes on the controllers.
#
# What lives here is only what no route can state: the document's identity and
# the shapes shared across operations — the RFC 9457 problem format, the form
# envelope, and the three error responses every endpoint reuses.
#
# `make docs` dumps it to docs/openapi.yaml, which is what clients read and what
# tests/UserInterface/Api/OpenApiComplianceTest.php validates real traffic against.
nelmio_api_doc:
    areas:
        default:
            path_patterns: ['^/api']
    documentation:
        openapi: 3.1.0
        info:
            title: ingot-forms API
            version: 0.2.0
            description: >-
                Forms management backend. A form is a single fillable document: one
                immutable definition plus one data set with a required expire date.
                Lifecycle: empty → draft (repeatable lenient saves) → confirmed (strict
                validation, locked forever). Expired forms answer 410 everywhere. Every
                error response is an RFC 9457 `application/problem+json` document.
            license:
                name: MIT
                identifier: MIT
        servers:
            - url: /
        components:
            schemas:
                FormStatus:
                    type: string
                    enum: [empty, draft, confirmed]
                    description: Derived, never stored — empty until the first save, confirmed once locked.
                FormDefinition:
                    type: object
                    description: >-
                        A form definition document. Its authoritative contract is the
                        meta-schema served at `GET /api/schemas/definition` (1–1000 typed
                        items with unique names) — the constraints are deliberately not
                        duplicated here, which is why that endpoint exists.
                FormValues:
                    type: object
                    description: >-
                        Submitted values keyed by field name. This is the one payload no
                        DTO can declare — its members come from the form's own definition —
                        so the only rule stated here is that it must be a JSON object. The
                        real contract is the schema derived from that form's definition,
                        enforced on every save and served live by `GET /api/forms/{id}/schema`.
                FormPresentation:
                    type: object
                    description: >-
                        How a form is shown. Its authoritative contract is the meta-schema
                        served at `GET /api/schemas/presentation`: an engine, a
                        tree of items — each either presenting a declared item of the form, or
                        holding other items, or standing on its own — and an optional catalogue
                        of translations. Text travels as codes, never as sentences, and the
                        rules that need the form itself (an item exists, a widget is one the
                        engine draws) are reported as `presentation.*` findings.
                DataSchema:
                    type: object
                    description: A JSON Schema 2020-12 document describing one form's values.
                CreatedForm:
                    type: object
                    description: >-
                        The answer to a creation: the identity of the new form and nothing
                        else. Everything else is readable at `Location`.
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            type: string
                            format: uuid
                FileReference:
                    type: object
                    description: >-
                        What an upload answers with, and exactly what a `file` item in this
                        form's values may hold — echoed back member for member. All four are
                        measured by the server: the id it minted, the name it kept (a label,
                        never a path), the bytes it counted and the media type it sniffed from
                        those bytes. A values document naming anything else about a file is
                        refused (`form.file.unknown`, `form.file.mismatch`).
                    required: [id, name, size, type]
                    additionalProperties: false
                    properties:
                        id:
                            type: string
                            format: uuid
                        name:
                            type: string
                            minLength: 1
                            maxLength: 255
                        size:
                            type: integer
                            minimum: 1
                        type:
                            type: string
                            description: A media type, lower case, as the server sniffed it — not as the browser claimed.
                FormRevisionWithActor:
                    type: object
                    description: >-
                        One accepted save, as the management side sees it: the same
                        thing a filler is shown, plus who entered it and when the form
                        reported it.
                    required: [seq, savedAt, confirmed, actor, notifiedAt]
                    additionalProperties: false
                    properties:
                        seq:
                            type: integer
                            minimum: 1
                        savedAt:
                            type: string
                            format: date-time
                        confirmed:
                            type: boolean
                        actor:
                            type: [string, 'null']
                            maxLength: 255
                            description: >-
                                The identity that was asserted when this save was accepted —
                                an opaque subject, exactly as whatever authenticated the caller
                                said it, never parsed or resolved into a person by this service.
                                Null on a form created as `anonymous`, which records nobody
                                whatever a gateway asserted.
                        notifiedAt:
                            type: [string, 'null']
                            format: date-time
                            description: >-
                                When whoever owns this form was told about this save. Null covers
                                three things on purpose — not told yet, given up on, and a form
                                that reports nowhere; `GET /api/manage/forms/{id}/deliveries`
                                tells those apart, because that is where the work is. Stamped on
                                the save itself when somebody was told about it — so it leaves
                                with the revision when the history limit evicts it, the way
                                everything else about that save does.
                FormHistoryWithActors:
                    type: object
                    description: Every accepted save of one form, newest first, with who entered each.
                    required: [revisions]
                    additionalProperties: false
                    properties:
                        revisions:
                            type: array
                            items:
                                $ref: '#/components/schemas/FormRevisionWithActor'
                FormDeliveries:
                    type: object
                    description: >-
                        What one form still owes and what it could not deliver, newest first.
                        Empty for a form that names no endpoint — nothing is queued for one —
                        and empty again once everything has been told, because a delivered
                        notification is stamped on the thing it was about instead.
                    required: [deliveries]
                    additionalProperties: false
                    properties:
                        deliveries:
                            type: array
                            items:
                                $ref: '#/components/schemas/FormDelivery'
                FormDelivery:
                    type: object
                    description: >-
                        One notification a form still owes, or could not deliver. A *delivered*
                        one is not here: the moment somebody has been told, the fact moves to
                        the thing it is about — `notifiedAt` on that save in
                        `GET /api/manage/forms/{id}/history`, or `confirmNotifiedAt` on the form
                        — and this row goes, because it has stopped being work.
                    required: [delivery, event, revision, occurredAt, target, actor, state, attempts, nextAttemptAt, lastRefusal]
                    additionalProperties: false
                    properties:
                        delivery:
                            type: string
                            format: uuid
                            description: >-
                                The id that went out as `X-Forms-Delivery`, the same across every
                                retry — so this entry and a line in the receiver's own log are the
                                same event.
                        event:
                            type: string
                            enum: [form.saved, form.confirmed]
                        revision:
                            type: [integer, 'null']
                            minimum: 1
                            description: Which save this was about; null for a confirmation, which is no revision.
                        occurredAt:
                            type: string
                            format: date-time
                            description: When the thing happened, not when it was told.
                        target:
                            type: string
                            format: uri
                            description: >-
                                Where it was to be told. Kept per delivery rather than read off the
                                form, so what was actually used is what is served.
                        actor:
                            type: [string, 'null']
                            maxLength: 255
                            description: Who did the thing being reported. Null on a form that records nobody.
                        state:
                            type: string
                            enum: [owed, abandoned]
                            description: >-
                                `owed` is nothing tried yet, or refused and waiting for
                                `nextAttemptAt`; `abandoned` means refused too many times and
                                never tried again. Derived from `gaveUpAt` rather than stored, so
                                nothing can disagree with it.
                        attempts:
                            type: integer
                            minimum: 0
                            description: How many times a receiver refused this.
                        nextAttemptAt:
                            type: string
                            format: date-time
                            description: >-
                                When it will be tried again. Meaningless once told or abandoned,
                                which is what `state` is for.
                        lastRefusal:
                            type: [string, 'null']
                            description: What the receiver said the last time it refused.
                FormRevision:
                    type: object
                    description: >-
                        One accepted save of a form. The document itself is read one at a
                        time; this is what a client chooses by.
                    required: [seq, savedAt, confirmed]
                    additionalProperties: false
                    properties:
                        seq:
                            type: integer
                            minimum: 1
                            description: Per form, in the order the saves happened.
                        savedAt:
                            type: string
                            format: date-time
                        confirmed:
                            type: boolean
                            description: >-
                                Whether a confirmation locked this save. Derived, never stored —
                                confirming writes no values, so it is no revision of its own.
                FormHistory:
                    type: object
                    description: Every accepted save of one form, newest first.
                    required: [revisions]
                    additionalProperties: false
                    properties:
                        revisions:
                            type: array
                            items:
                                $ref: '#/components/schemas/FormRevision'
                FormEnvelope:
                    type: object
                    description: The canonical JSON shape of a form read back from the API.
                    required: [id, status, expireDate, createdAt, definition, data, dataSavedAt, confirmedAt, confirmNotifiedAt, identity, author, confirmedBy, webhooks]
                    additionalProperties: false
                    properties:
                        id:
                            type: string
                            format: uuid
                        status:
                            $ref: '#/components/schemas/FormStatus'
                        expireDate:
                            type: string
                            format: date-time
                        createdAt:
                            type: string
                            format: date-time
                        definition:
                            $ref: '#/components/schemas/FormDefinition'
                        data:
                            oneOf:
                                - $ref: '#/components/schemas/FormValues'
                                - type: 'null'
                        dataSavedAt:
                            type: [string, 'null']
                            format: date-time
                        confirmedAt:
                            type: [string, 'null']
                            format: date-time
                        confirmNotifiedAt:
                            type: [string, 'null']
                            format: date-time
                            description: >-
                                When this form told whoever owns it that it had been confirmed.
                                Null while it has not been told — not yet, given up on, or a form
                                that reports nowhere. On the form rather than on a revision
                                because confirming writes no values and is no revision.
                        identity:
                            type: string
                            enum: [recorded, anonymous]
                            description: >-
                                Whether this form records who fills it in. Given at creation and
                                immutable. `anonymous` discards an asserted identity rather than
                                refusing it, so a gateway asserting on every request cannot build
                                a record by accident.
                        author:
                            type: [string, 'null']
                            maxLength: 255
                            description: >-
                                Who created this form — an opaque subject as whatever authenticated
                                the caller said it, never resolved into a person here. Null when
                                nobody was asserted. Outside `identity` on purpose: an anonymous
                                form still has an author, because somebody created it.
                        confirmedBy:
                            type: [string, 'null']
                            maxLength: 255
                            description: >-
                                Who locked this form. Its own member because confirming writes no
                                values and is therefore no revision — without it, the most
                                consequential act on a form would be the one nobody attributed.
                                Null while the form is open, and on an anonymous form.
                        webhooks:
                            $ref: '#/components/schemas/FormWebhooks'
                FormWebhooks:
                    type: object
                    description: >-
                        Where this form reports what happens to it, as it was given at creation and
                        for the life of the form. Both members are independent and either may be
                        null, which means nobody is told about that event. What arrives there is a
                        notification and never the values — `{event, form, occurredAt, revision?,
                        actor?}` — signed with this deployment's secret in `X-Forms-Signature`, and
                        carrying `X-Forms-Delivery` so a receiver can recognise a retry of one it
                        already acted on.
                    required: [save, confirm]
                    additionalProperties: false
                    properties:
                        save:
                            type: [string, 'null']
                            format: uri
                            maxLength: 2000
                            description: Told when a draft save is accepted, with the revision it became.
                        confirm:
                            type: [string, 'null']
                            format: uri
                            maxLength: 2000
                            description: Told when the form is confirmed. A confirmation is no revision, so it carries none.
                ProblemError:
                    type: object
                    description: One validation error, mapped 1:1 from the engine's report or a constraint violation.
                    required: [pointer, code, message]
                    additionalProperties: false
                    properties:
                        pointer:
                            type: string
                            description: RFC 6901 JSON Pointer into the offending document ("" is its root).
                        code:
                            type: string
                            description: Machine-readable code, e.g. `schema.required`, `request.range` or `form.field.duplicate-name`.
                        message:
                            type: string
                        input:
                            type: [string, number, boolean]
                            description: The offending value — echoed only when it is a scalar.
                Problem:
                    type: object
                    description: >-
                        RFC 9457 problem details. `type` is a URN
                        `urn:problem:ingot-forms:<slug>`; validation problems carry the
                        `errors` extension member.
                    required: [type, title, status]
                    additionalProperties: false
                    properties:
                        type:
                            type: string
                            format: uri
                        title:
                            type: string
                        status:
                            type: integer
                        detail:
                            type: string
                        errors:
                            type: array
                            items:
                                $ref: '#/components/schemas/ProblemError'
            responses:
                MalformedJson:
                    description: The request body is not valid JSON, or its media type is missing.
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                            examples:
                                malformed-json:
                                    summary: Unparsable body
                                    value:
                                        type: 'urn:problem:ingot-forms:malformed-json'
                                        title: Request body is not valid JSON.
                                        status: 400
                UnsupportedMediaType:
                    description: The request body is not `application/json` — no other media type is accepted.
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                            examples:
                                unsupported-media-type:
                                    summary: A form-encoded or missing content type
                                    value:
                                        type: 'urn:problem:ingot-forms:unsupported-media-type'
                                        title: Only application/json request bodies are accepted.
                                        status: 415
                FormNotFound:
                    description: No form with this id.
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                            examples:
                                form-not-found:
                                    summary: Unknown id
                                    value:
                                        type: 'urn:problem:ingot-forms:form-not-found'
                                        title: Form not found.
                                        status: 404
                FormGone:
                    description: The form has expired; its data is scheduled for physical deletion.
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                            examples:
                                form-gone:
                                    summary: Past its expire date
                                    value:
                                        type: 'urn:problem:ingot-forms:form-gone'
                                        title: Form has expired.
                                        status: 410
