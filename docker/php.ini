; Uploads. A file item's `maxSize` is the published contract, so a deployment has
; to allow at least the largest one any definition served here asks for —
; otherwise the real limit is this file and no client is told about it. The
; application's own ceiling (FILES_MAX_UPLOAD) must stay at or below these two.
upload_max_filesize = 16M
post_max_size = 16M
