# A gateway in front of ingot-forms, as small as one can be while still being
# the thing that decides who may act.
#
# The service authorises nothing. This file is the other half of that sentence:
# four prefixes, one rule each, the form id always the segment straight after
# the prefix, and one subrequest for the question a path cannot answer — "may
# *this* caller touch *this* form".
#
# Run it with the compose file beside this one. Every `set $…` at the top is
# what a real deployment replaces.

worker_processes 1;
events { worker_connections 256; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # One minute is long enough to make a page's dozen requests one question
    # and short enough that revoking access is not a deployment.
    proxy_cache_path /var/cache/nginx/decisions levels=1:2 keys_zone=decisions:1m max_size=16m inactive=2m;

    server {
        listen 80;
        server_name _;

        # ── Where the two things behind this are ─────────────────────────────
        #
        # Addresses in variables, and a resolver, on purpose: an `upstream`
        # block is resolved once at startup, so a gateway written that way
        # **refuses to start** while the service is down and keeps a stale
        # address after it moves. Written this way, nginx asks again — which is
        # what a deployment where either side can restart needs. (Docker's
        # embedded DNS is 127.0.0.11; on Kubernetes it is the cluster's.)
        resolver 127.0.0.11 ipv6=off valid=10s;

        # Two other containers, both named by the compose file beside this one:
        #
        #   php:8000             the service. `php` is its *service name* there
        #                        (`php -S 0.0.0.0:8000 -t public`), which is
        #                        what compose puts in DNS — and unlike a
        #                        container name it does not change when somebody
        #                        clones this into a differently named directory.
        #
        #   decision-point:9000  the stand-in for the system that owns the
        #                        forms. Port 9000 only so that it is obviously
        #                        not the service.
        set $forms   "php:8000";
        set $decider "decision-point:9000";

        # ── Who the caller is ────────────────────────────────────────────────
        #
        # **Nobody outside sends this.** Read that first, because the one line
        # below is the only part of this file that looks otherwise: it takes the
        # subject from a request header so that a smoke test can pretend
        # somebody logged in, and it is the first line a real deployment
        # deletes.
        #
        # In a deployment the subject comes from whatever actually
        # authenticated somebody, and never from the request:
        #
        #     set $subject $ssl_client_s_dn;                    # mTLS
        #     set $subject $upstream_http_x_auth_request_email; # oauth2-proxy / Authelia
        #     set $subject $cookie_session;                     # your own session, looked up
        #
        # What must not change is the line after it. The service reads
        # `X-Forms-Identity` **only** from an address in `FORMS_TRUSTED_PROXIES`
        # — so this gateway has to be that address — and `proxy_set_header` runs
        # on *every* request, which is what makes a client's own
        # `X-Forms-Identity` replaced rather than believed. That is the whole
        # defence: rows written under a forgeable header can never be repaired
        # or even told apart from the good ones.
        set $subject $http_x_demo_user;  # ← DELETE ME; see above

        proxy_set_header X-Forms-Identity $subject;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Host $host;

        # ── The contract a form's own page depends on ────────────────────────
        #
        # A page saves with `fetch`, and `fetch` follows redirects: a login page
        # arriving as 200 with HTML would tell somebody their answers were
        # stored when they were not. So anything that is not a navigation must
        # be refused with a status, never redirected. Both kits already turn an
        # unparseable refusal into their own wording, so a 401 reads correctly.
        error_page 401 = @refused;
        error_page 403 = @refused;

        location @refused {
            internal;
            default_type application/problem+json;
            return 403 '{"type":"urn:problem:gateway:forbidden","title":"Not yours to touch.","status":403}';
        }

        # ── 1. The contract, open to anybody ────────────────────────────────
        #
        # A contract stated once has to be reachable: this is what a client
        # writes against.
        location /api/schemas/ {
            proxy_pass http://$forms;
        }

        # ── 2. The pages' own files, open to anybody ────────────────────────
        #
        # FORMS_ASSETS_PREFIX. Not a route — served as files, GET, cacheable,
        # and holding no form data. The rule most often forgotten: a gateway
        # that passes the forms through and drops their stylesheet has followed
        # every rule above it to the letter.
        location /assets/ {
            proxy_pass http://$forms;
            proxy_cache_valid 200 1h;
        }

        # ── 3. Management: the system that owns the form ─────────────────────
        #
        # Never the open internet. `POST /api/manage/forms` is an
        # unauthenticated *write* as far as this service is concerned, so
        # whatever fronts it is where the client authentication and the rate
        # limit go.
        #
        # The shared secret below is the second and last piece of make-believe
        # in this file, and it is here for the same reason as `$subject`: a
        # runnable example needs *some* way to tell the owning system from
        # everybody else. A deployment uses mTLS, or a network the public cannot
        # reach, or its own service tokens — the point is only that this
        # location is closed to whoever is filling forms in.
        location /api/manage/ {
            if ($http_x_manage_key != "replace-me") { return 403; }  # ← REPLACE ME

            proxy_pass http://$forms;
        }

        # ── 4. Filling one form, over JSON ──────────────────────────────────
        #
        # The form id is the segment straight after the prefix, which is what
        # makes this one regex rather than one per endpoint.
        # Quoted, because a `{` in an unquoted nginx value starts a block: the
        # length is part of the pattern, not the beginning of a section.
        location ~ "^/api/forms/(?<form>[0-9a-fA-F-]{36})(/|$)" {
            auth_request /_may_i;
            proxy_pass http://$forms;
        }

        # Anything under the filling prefix that names no form is not an
        # address of this service — refuse it here rather than letting it reach
        # the application to be refused there.
        location /api/forms/ { return 404; }

        # ── 5. The same form, in a browser ──────────────────────────────────
        location ~ "^/forms/(?<form>[0-9a-fA-F-]{36})(/|$)" {
            auth_request /_may_i;
            proxy_pass http://$forms;
        }

        location /forms/ { return 404; }

        # ── The question a path cannot answer ────────────────────────────────
        #
        # Whoever created the form knows who may touch it, and that answer is
        # theirs to keep. This asks them, passing the four things the answer can
        # depend on: which form, who is asking, what they are trying to do, and
        # where.
        #
        # These four headers are **written here, by the gateway**. They are not
        # something a client sends and not something the service ever sees: this
        # is one internal subrequest, from the gateway to the system that owns
        # the forms, and its answer decides whether the real request is even
        # attempted. The method matters — read is GET, confirm is its own address,
        # filling is everything else — so a decision point can implement all
        # five permissions without this file growing a branch per endpoint.
        location = /_may_i {
            internal;
            proxy_pass http://$decider/decide;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Forms-Decision-Form    $form;
            proxy_set_header X-Forms-Decision-Subject $subject;
            proxy_set_header X-Forms-Decision-Method  $request_method;
            proxy_set_header X-Forms-Decision-Path    $request_uri;

            # One question per (form, subject, method) for a minute. Without
            # this, drawing one page asks it a dozen times.
            proxy_cache decisions;
            proxy_cache_key "$form|$subject|$request_method";
            proxy_cache_valid 200 204 1m;
            proxy_cache_valid 403 10s;
        }

        # ── Everything else ─────────────────────────────────────────────────
        #
        # An address in no group is an address no rule above covers, which is a
        # mistake rather than a fifth audience — `app:routes:groups` prints the
        # table this file should be diffed against.
        location / { return 404; }
    }
}
