# Module boundaries — enforced in CI (make deptrac).
#
# Domain         = the forms model, its exceptions and the ports it declares.
#                  Framework-free and storage-free, so it can be extracted into a
#                  standalone package later (vendor deps are invisible to deptrac;
#                  the rules below keep App layers out).
# Application    = use cases: one class per thing the system does, orchestrating
#                  the domain behind ports it declares for what it cannot do itself.
# Infrastructure = the adapters filling those ports: Doctrine, cache, the Symfony
#                  form and the derived schema.
# UserInterface  = what talks to the outside — HTTP controllers with their request
#                  DTOs and problem mapping, and the console commands. It reaches
#                  the application, never an adapter.
deptrac:
  paths:
    - src
  layers:
    - name: Domain
      collectors:
        - type: classLike
          value: ^App\\Domain\\
    - name: Application
      collectors:
        - type: classLike
          value: ^App\\Application\\
    - name: Infrastructure
      collectors:
        - type: classLike
          value: ^App\\Infrastructure\\
    - name: UserInterface
      collectors:
        - type: classLike
          value: ^App\\UserInterface\\
  ruleset:
    Domain: ~
    Application: [Domain]
    Infrastructure: [Domain, Application]
    UserInterface: [Domain, Application]
