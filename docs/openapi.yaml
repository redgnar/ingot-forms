openapi: 3.1.0
info:
  title: 'ingot-forms API'
  description: 'Forms management backend. A form is a single fillable document: one immutable definition plus one data set with a required expire date. Lifecycle: empty → draft (repeatable lenient saves) → confirmed (strict validation, locked forever). Expired forms answer 410 everywhere. Every error response is an RFC 9457 `application/problem+json` document.'
  license:
    name: MIT
    identifier: MIT
  version: 0.2.0
servers:
  -
    url: /
paths:
  '/api/forms/{id}/confirm':
    post:
      summary: 'Confirm the stored values'
      description: 'Validates the stored data against the full strict schema and locks the form forever. A definition containing an unknown (plugin) field type cannot be confirmed — the server will not vouch for a value contract it does not know.'
      operationId: confirmForm
      parameters:
        -
          name: If-Match
          in: header
          description: 'Optional. The revision the caller read, as its entity tag — `"7"`, several of them (`"7", "8"`), or `*` for any. When it names a revision the form has left behind, nothing is locked and the answer is `412`; when it is absent, whatever is stored is confirmed. The tag comes from the `ETag` of `GET /api/forms/{id}/data`, and `"0"` means "only if nobody has filled this in yet".'
          required: false
          schema:
            type: string
            example: '"7"'
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[13-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      responses:
        '204':
          description: 'Form confirmed and locked. No body.'
        '404':
          $ref: '#/components/responses/FormNotFound'
        '409':
          description: 'Nothing to confirm, or already confirmed.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                form-data-empty:
                  summary: 'No draft to confirm'
                  value: { type: 'urn:problem:ingot-forms:form-data-empty', title: 'There is no data to confirm.', status: 409 }
                form-already-confirmed:
                  summary: 'Confirming twice'
                  value: { type: 'urn:problem:ingot-forms:form-already-confirmed', title: 'Form data is already confirmed.', status: 409 }
        '412':
          description: 'The caller said which revision it read and the form has moved on since. Nothing was locked.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                form-moved-on:
                  summary: 'Somebody saved between reading and confirming'
                  value: { type: 'urn:problem:ingot-forms:form-moved-on', title: 'The form has changed since you read it.', status: 412 }
        '410':
          $ref: '#/components/responses/FormGone'
        '422':
          description: 'The stored data fails the strict contract.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                required-missing:
                  summary: 'A required field was never filled in'
                  value: { type: 'urn:problem:ingot-forms:request-not-valid', title: 'Request is not valid.', status: 422, errors: [{ pointer: /email, code: schema.required, message: '"email" is required.' }, { pointer: /lines/1/quantity, code: schema.required, message: '"quantity" is required.' }] }
                unknown-field-type:
                  summary: 'The definition carries a plugin field the server cannot vouch for'
                  value: { type: 'urn:problem:ingot-forms:request-not-valid', title: 'Request is not valid.', status: 422, errors: [{ pointer: /items/3/type, code: form.data.unknown-field-type, message: 'Field "sig" has unknown type "signature" — its value contract cannot be confirmed.', input: signature }] }
  /api/manage/forms:
    post:
      summary: 'Create a form'
      description: 'Both documents a form is made of arrive here: what it asks, and optionally how it is shown. Both are immutable afterwards — changing either means delete and recreate. A form may also be born holding values a client already knows (`data`), judged under the draft contract, which makes it a draft from the start. Problems inside a document are reported with JSON Pointers rooted at `/definition`, `/presentation` or `/data`.'
      operationId: createForm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFormRequest'
      responses:
        '201':
          description: 'Form created. The body carries the new id and nothing else — everything else the client already sent, or can read back from `Location`.'
          headers:
            Location:
              description: 'Path of the created form, `/api/manage/forms/{id}`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedForm'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: 'The request envelope, the definition, the presentation or the values the form would be born with are not valid.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                request-not-valid:
                  summary: 'The body does not match the request DTO, or the form expires in the past'
                  value: { type: 'urn:problem:ingot-forms:request-not-valid', title: 'Request is not valid.', status: 422, errors: [{ pointer: /expireDate, code: form.expire_date.past, message: 'expireDate must be in the future.', input: '2020-01-01T00:00:00+00:00' }, { pointer: /bogus, code: request.unexpected_key, message: 'Unexpected member "bogus".' }] }
                definition-not-valid:
                  summary: 'The definition breaks the meta-schema or a semantic rule'
                  value: { type: 'urn:problem:ingot-forms:definition-not-valid', title: 'Form definition is not valid.', status: 422, errors: [{ pointer: /definition/items/1/name, code: form.field.duplicate-name, message: 'Field name "email" is not unique.', input: email }] }
                data-not-valid:
                  summary: 'A value the form is asked to be born with does not fit the item it belongs to'
                  value: { type: 'urn:problem:ingot-forms:request-not-valid', title: 'Request is not valid.', status: 422, errors: [{ pointer: /data/age, code: schema.minimum, message: 'The number must be at least 18.', input: 7 }] }
                presentation-not-valid:
                  summary: 'The presentation shows an item the definition does not declare'
                  value: { type: 'urn:problem:ingot-forms:presentation-not-valid', title: 'Form presentation is not valid.', status: 422, errors: [{ pointer: /presentation/items/0/name, code: presentation.item.unknown, message: 'This form declares no item named "nickname".', input: nickname }] }
  '/api/manage/forms/{id}':
    get:
      summary: 'Read a form'
      operationId: getForm
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[13-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      responses:
        '200':
          description: 'The full form envelope.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormEnvelope'
        '404':
          $ref: '#/components/responses/FormNotFound'
        '409':
          description: 'The form is stored under rules that have since changed, so it cannot be read back. The findings say which.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                form-unreadable:
                  summary: 'A document accepted before a rule was tightened'
                  value: { type: 'urn:problem:ingot-forms:form-unreadable', title: 'The stored form no longer satisfies the rules it is read with.', status: 409, errors: [{ pointer: /items, code: presentation.confirm.missing, message: 'A presentation must offer somewhere to confirm the form.', input: confirm }] }
        '410':
          $ref: '#/components/responses/FormGone'
    delete:
      summary: 'Delete a form'
      description: 'The "definition changed" path — delete the form and create a new one.'
      operationId: deleteForm
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[13-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      responses:
        '204':
          description: 'Form deleted.'
        '404':
          $ref: '#/components/responses/FormNotFound'
        '410':
          $ref: '#/components/responses/FormGone'
  '/api/forms/{id}/files/{fileId}':
    get:
      summary: 'Download a file this form holds'
      description: "Answers only for a file the form's stored values name: an upload nobody saved, a file a later draft stopped naming, and a file that never existed are all the same 404. A confirmed form still hands its files over; an expired one hands over nothing. Always `Content-Disposition: attachment` with `X-Content-Type-Options: nosniff` — these are somebody else's bytes."
      operationId: readFormFile
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[13-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
        -
          name: fileId
          in: path
          required: true
          schema:
            type: string
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[13-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      responses:
        '200':
          description: 'The bytes, with the media type the server sniffed when they arrived.'
          headers:
            Content-Disposition:
              description: 'Always `attachment`, with the name the upload recorded.'
              schema:
                type: string
            X-Content-Type-Options:
              description: 'Always `nosniff`.'
              schema:
                type: string
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: 'No such form, or this form does not name that file.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          $ref: '#/components/responses/FormGone'
    delete:
      summary: 'Throw away an uploaded file this form has not saved'
      description: 'For an upload that was replaced or picked by mistake. A file the stored values name is refused with 409 — a saved document is what makes a file permanent, and it stops being permanent by being saved out of the document, not by this.'
      operationId: discardFormFile
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[13-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
        -
          name: fileId
          in: path
          required: true
          schema:
            type: string
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[13-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      responses:
        '204':
          description: Gone.
        '404':
          description: 'No such form, or this form holds no such file.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'The stored values name this file.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          $ref: '#/components/responses/FormGone'
  '/api/forms/{id}/data':
    get:
      summary: 'Read the current values'
      operationId: getFormData
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[13-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      responses:
        '200':
          description: 'The stored values (draft or confirmed). The `ETag` is the number of the save these values are — hand it back in `If-Match` on `PUT` or `POST …/confirm` to be refused rather than overwrite whatever somebody saved in between.'
          headers:
            ETag:
              description: 'The revision these values are, as an entity tag.'
              schema:
                type: string
                example: '"7"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormValues'
        '404':
          description: 'Unknown form, or a form that has no data yet.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                form-data-empty:
                  summary: 'The form exists but was never filled in'
                  value: { type: 'urn:problem:ingot-forms:form-data-empty', title: 'The form has no data yet.', status: 404 }
        '410':
          $ref: '#/components/responses/FormGone'
    put:
      summary: 'Save draft values'
      description: 'Repeatable; overwrites the previous draft. Values are validated against the draft variant of the derived schema — types, enums, ranges and the closed property set are enforced, `required` is not.'
      operationId: saveFormData
      parameters:
        -
          name: If-Match
          in: header
          description: 'Optional. The revision the caller read, as its entity tag — `"7"`, several of them (`"7", "8"`), or `*` for any. When it names a revision the form has left behind, nothing is stored and the answer is `412`; when it is absent, the save is unconditional. The tag comes from the `ETag` of `GET /api/forms/{id}/data`, and `"0"` means "only if nobody has filled this in yet".'
          required: false
          schema:
            type: string
            example: '"7"'
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[13-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormValues'
      responses:
        '204':
          description: 'Draft stored. No body: read the form if you need its new state.'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '404':
          $ref: '#/components/responses/FormNotFound'
        '409':
          description: 'The form is confirmed and locked.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                form-locked:
                  summary: 'Editing a confirmed form'
                  value: { type: 'urn:problem:ingot-forms:form-locked', title: 'Form data is confirmed and can no longer be edited.', status: 409 }
        '412':
          description: 'The caller said which revision it read and the form has moved on since. Nothing was stored.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                form-moved-on:
                  summary: 'Somebody saved in between'
                  value: { type: 'urn:problem:ingot-forms:form-moved-on', title: 'The form has changed since you read it.', status: 412 }
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '410':
          $ref: '#/components/responses/FormGone'
        '422':
          description: 'The body is not a JSON object, or the values break the form-s own contract.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                form-data-not-valid:
                  summary: 'A value the derived schema refuses'
                  value: { type: 'urn:problem:ingot-forms:request-not-valid', title: 'Request is not valid.', status: 422, errors: [{ pointer: /age, code: schema.type, message: 'The data (string) must match the type: number' }] }
  '/api/manage/forms/{id}/deliveries':
    get:
      summary: 'List what this form still owes, and what it could not deliver'
      description: "Newest first. A *delivered* notification is not here — the moment somebody has been told, the fact moves to the thing it was about (`notifiedAt` on that save in `GET /api/manage/forms/{id}/history`, `confirmNotifiedAt` on the form) and the row goes, because it has stopped being work. So this is the work list: each entry is one thing that happened to the form (`form.saved` with the revision it became, or `form.confirmed`), the endpoint it is to be told to, and its state — `owed` (nothing tried yet, or refused and waiting for `nextAttemptAt`) or `abandoned` (refused `attempts` times and never tried again, `lastRefusal` saying what the receiver said). Empty for a form that names no endpoint, and empty again once everything has been told. `delivery` is the id that went out as `X-Forms-Delivery`, so an entry here and a line in the receiver's own log are the same event."
      operationId: getFormDeliveries
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[13-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      responses:
        '200':
          description: 'What is outstanding, newest first.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormDeliveries'
        '404':
          $ref: '#/components/responses/FormNotFound'
        '410':
          $ref: '#/components/responses/FormGone'
  '/api/forms/{id}/history':
    get:
      summary: 'List every accepted save of this form'
      description: 'Newest first, because that is what somebody looking for an earlier version is usually after. The documents themselves are read one at a time (`GET /api/forms/{id}/history/{seq}`), because a list carrying every version of every answer is a response nobody asked for. `confirmed` marks the save a confirmation locked — derived, never stored: confirming writes no values, so it is no revision of its own.'
      operationId: getFormHistory
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[13-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      responses:
        '200':
          description: 'The history, newest first. Empty for a form nobody has filled in.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormHistory'
        '404':
          $ref: '#/components/responses/FormNotFound'
        '410':
          $ref: '#/components/responses/FormGone'
  '/api/manage/forms/{id}/history':
    get:
      summary: 'List every accepted save of this form, with who entered it'
      description: 'The management side of `GET /api/forms/{id}/history`: the same saves, newest first, each carrying the identity that was asserted when it was accepted and the moment the form reported that save to whoever owns it (`notifiedAt`, null when it has not been told, was given up on, or the form reports nowhere — `GET /api/manage/forms/{id}/deliveries` tells those three apart). `actor` is null on a form created as `anonymous` — that form records nobody, whatever a gateway asserted. It is served here and not on the fill side so that one person who was let through to a form learns nothing about who else filled it in. The subject is opaque: it is whatever authenticated the caller said, never resolved into a person by this service.'
      operationId: getManagedFormHistory
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[13-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      responses:
        '200':
          description: 'The history, newest first. Empty for a form nobody has filled in.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormHistoryWithActors'
        '404':
          $ref: '#/components/responses/FormNotFound'
        '410':
          $ref: '#/components/responses/FormGone'
  '/api/forms/{id}/presentation':
    get:
      summary: 'Read how the form is shown'
      description: "The document as it was set. Codes are served unresolved: which language a client shows is the client's to decide, so nothing here reads Accept-Language."
      operationId: getFormPresentation
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[13-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      responses:
        '200':
          description: 'The presentation document.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormPresentation'
        '404':
          description: 'Unknown form, or a form nobody has said anything about yet.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                presentation-not-set:
                  summary: 'The form exists; how to show it was never said'
                  value: { type: 'urn:problem:ingot-forms:presentation-not-set', title: 'The form has no presentation.', status: 404 }
        '410':
          $ref: '#/components/responses/FormGone'
  '/api/forms/{id}/history/{seq}':
    get:
      summary: 'Read one save of this form'
      description: 'The values as that save stored them, byte for byte — exactly as `GET /api/forms/{id}/data` serves the current ones. Send them back through `PUT /api/forms/{id}/data` to restore them, whole or in part; there is no endpoint that does it for you.'
      operationId: getFormRevision
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[13-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
        -
          name: seq
          in: path
          required: true
          schema:
            type: string
            pattern: '[0-9]+'
      responses:
        '200':
          description: 'The values that save stored.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormValues'
        '404':
          description: 'Unknown form, or a form with no such save.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                revision-not-found:
                  summary: 'The form exists and was never saved that many times'
                  value: { type: 'urn:problem:ingot-forms:revision-not-found', title: 'The form has no such save.', status: 404 }
        '410':
          $ref: '#/components/responses/FormGone'
  '/api/schemas/{document}':
    get:
      summary: 'Read the meta-schema of a definition or a presentation'
      description: 'The JSON Schema 2020-12 document `POST /api/forms` judges that half of its body by — the authoritative contract for what a definition or a presentation may say, which is stated here rather than duplicated into this document. Fixed for a deployment: it changes when the service does, never because of anything a client did.'
      operationId: getMetaSchema
      parameters:
        -
          name: document
          in: path
          required: true
          schema:
            type: string
            pattern: definition|presentation
            enum:
              - definition
              - presentation
      responses:
        '200':
          description: 'The meta-schema, as the server holds it.'
          content:
            application/schema+json:
              schema:
                type: object
        '404':
          description: 'This API publishes no such meta-schema.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/api/forms/{id}/schema':
    get:
      summary: 'Read the values schema derived from the definition'
      description: 'The JSON Schema 2020-12 document the server validates submitted values against — shippable to a frontend validator as-is. The draft variant drops `required` (and the required-driven non-empty rule) so partial progress validates.'
      operationId: getFormDataSchema
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[13-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
        -
          name: mode
          in: query
          description: 'Which contract the returned schema enforces: `strict` is the confirmation contract, `draft` relaxes what would block storing partial progress.'
          required: false
          schema:
            description: 'Which contract the returned schema enforces: `strict` is the confirmation contract, `draft` relaxes what would block storing partial progress.'
            type: string
            example: draft
            default: strict
            enum:
              - strict
              - draft
          example: draft
      responses:
        '200':
          description: 'The derived values schema.'
          content:
            application/schema+json:
              schema:
                $ref: '#/components/schemas/DataSchema'
        '404':
          $ref: '#/components/responses/FormNotFound'
        '410':
          $ref: '#/components/responses/FormGone'
        '422':
          description: 'Unknown schema mode.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                request-not-valid:
                  summary: 'A mode outside the enum'
                  value: { type: 'urn:problem:ingot-forms:request-not-valid', title: 'Request is not valid.', status: 422, errors: [{ pointer: /mode, code: request.choice, message: 'mode must be one of: strict, draft.', input: bogus }] }
  '/api/forms/{id}/files':
    post:
      summary: 'Upload a file for this form'
      description: "One `multipart/form-data` part named `file`. The answer is the description of what was stored — id, name, size and media type, all four measured here — and that description, echoed verbatim, is what a `file` item in this form's values may hold. A file nobody saves stays temporary and is collected later; it can also be thrown away at once with `DELETE /api/forms/{id}/files/{fileId}`."
      operationId: uploadFormFile
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[13-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              required:
                - file
              properties:
                file:
                  description: 'The bytes.'
                  type: string
                  format: binary
              type: object
      responses:
        '201':
          description: 'Stored. The body is what to put in the values document, unchanged.'
          headers:
            Location:
              description: 'Where the file can be downloaded from, once the values name it.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileReference'
        '404':
          $ref: '#/components/responses/FormNotFound'
        '409':
          description: 'The form is confirmed, so nothing it holds can change; or it already holds as many files as it may.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          $ref: '#/components/responses/FormGone'
        '413':
          description: 'More bytes than this deployment accepts. The limit is configuration, and a deployment must allow at least the largest `maxSize` any definition served here asks for.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'No part named `file`, or a part with no bytes in it.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    FormStatus:
      description: 'Derived, never stored — empty until the first save, confirmed once locked.'
      type: string
      enum:
        - empty
        - draft
        - confirmed
    FormDefinition:
      description: 'A form definition document. Its authoritative contract is the meta-schema served at `GET /api/schemas/definition` (1–1000 typed items with unique names) — the constraints are deliberately not duplicated here, which is why that endpoint exists.'
      type: object
    FormValues:
      description: "Submitted values keyed by field name. This is the one payload no DTO can declare — its members come from the form's own definition — so the only rule stated here is that it must be a JSON object. The real contract is the schema derived from that form's definition, enforced on every save and served live by `GET /api/forms/{id}/schema`."
      type: object
    FormPresentation:
      description: 'How a form is shown. Its authoritative contract is the meta-schema served at `GET /api/schemas/presentation`: an engine, a tree of items — each either presenting a declared item of the form, or holding other items, or standing on its own — and an optional catalogue of translations. Text travels as codes, never as sentences, and the rules that need the form itself (an item exists, a widget is one the engine draws) are reported as `presentation.*` findings.'
      type: object
    DataSchema:
      description: "A JSON Schema 2020-12 document describing one form's values."
      type: object
    CreatedForm:
      description: 'The answer to a creation: the identity of the new form and nothing else. Everything else is readable at `Location`.'
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
      type: object
      additionalProperties: false
    FileReference:
      description: "What an upload answers with, and exactly what a `file` item in this form's values may hold — echoed back member for member. All four are measured by the server: the id it minted, the name it kept (a label, never a path), the bytes it counted and the media type it sniffed from those bytes. A values document naming anything else about a file is refused (`form.file.unknown`, `form.file.mismatch`)."
      required:
        - id
        - name
        - size
        - type
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
          minLength: 1
        size:
          type: integer
          minimum: 1
        type:
          description: 'A media type, lower case, as the server sniffed it — not as the browser claimed.'
          type: string
      type: object
      additionalProperties: false
    FormRevisionWithActor:
      description: 'One accepted save, as the management side sees it: the same thing a filler is shown, plus who entered it and when the form reported it.'
      required:
        - seq
        - savedAt
        - confirmed
        - actor
        - notifiedAt
      properties:
        seq:
          type: integer
          minimum: 1
        savedAt:
          type: string
          format: date-time
        confirmed:
          type: boolean
        actor:
          description: 'The identity that was asserted when this save was accepted — an opaque subject, exactly as whatever authenticated the caller said it, never parsed or resolved into a person by this service. Null on a form created as `anonymous`, which records nobody whatever a gateway asserted.'
          type:
            - string
            - 'null'
          maxLength: 255
        notifiedAt:
          description: 'When whoever owns this form was told about this save. Null covers three things on purpose — not told yet, given up on, and a form that reports nowhere; `GET /api/manage/forms/{id}/deliveries` tells those apart, because that is where the work is. Stamped on the save itself when somebody was told about it — so it leaves with the revision when the history limit evicts it, the way everything else about that save does.'
          type:
            - string
            - 'null'
          format: date-time
      type: object
      additionalProperties: false
    FormHistoryWithActors:
      description: 'Every accepted save of one form, newest first, with who entered each.'
      required:
        - revisions
      properties:
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/FormRevisionWithActor'
      type: object
      additionalProperties: false
    FormDeliveries:
      description: 'What one form still owes and what it could not deliver, newest first. Empty for a form that names no endpoint — nothing is queued for one — and empty again once everything has been told, because a delivered notification is stamped on the thing it was about instead.'
      required:
        - deliveries
      properties:
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/FormDelivery'
      type: object
      additionalProperties: false
    FormDelivery:
      description: 'One notification a form still owes, or could not deliver. A *delivered* one is not here: the moment somebody has been told, the fact moves to the thing it is about — `notifiedAt` on that save in `GET /api/manage/forms/{id}/history`, or `confirmNotifiedAt` on the form — and this row goes, because it has stopped being work.'
      required:
        - delivery
        - event
        - revision
        - occurredAt
        - target
        - actor
        - reason
        - state
        - attempts
        - nextAttemptAt
        - lastRefusal
      properties:
        delivery:
          description: "The id that went out as `X-Forms-Delivery`, the same across every retry — so this entry and a line in the receiver's own log are the same event."
          type: string
          format: uuid
        event:
          type: string
          enum:
            - form.created
            - form.saved
            - form.confirmed
            - form.deleted
        revision:
          description: 'Which save this was about; null for a confirmation, which is no revision.'
          type:
            - integer
            - 'null'
          minimum: 1
        occurredAt:
          description: 'When the thing happened, not when it was told.'
          type: string
          format: date-time
        target:
          description: 'Where it was to be told. Kept per delivery rather than read off the form, so what was actually used is what is served.'
          type: string
          format: uri
        actor:
          description: 'Who did the thing being reported. Null on a form that records nobody.'
          type:
            - string
            - 'null'
          maxLength: 255
        reason:
          description: 'Why the form is gone, for a `form.deleted`: `requested` or `expired`. Null for the other events, which have no such question.'
          type:
            - string
            - 'null'
          enum:
            - requested
            - expired
            - null
        state:
          description: '`owed` is nothing tried yet, or refused and waiting for `nextAttemptAt`; `abandoned` means refused too many times and never tried again. Derived from `gaveUpAt` rather than stored, so nothing can disagree with it.'
          type: string
          enum:
            - owed
            - abandoned
        attempts:
          description: 'How many times a receiver refused this.'
          type: integer
          minimum: 0
        nextAttemptAt:
          description: 'When it will be tried again. Meaningless once told or abandoned, which is what `state` is for.'
          type: string
          format: date-time
        lastRefusal:
          description: 'What the receiver said the last time it refused.'
          type:
            - string
            - 'null'
      type: object
      additionalProperties: false
    FormRevision:
      description: 'One accepted save of a form. The document itself is read one at a time; this is what a client chooses by.'
      required:
        - seq
        - savedAt
        - confirmed
      properties:
        seq:
          description: 'Per form, in the order the saves happened.'
          type: integer
          minimum: 1
        savedAt:
          type: string
          format: date-time
        confirmed:
          description: 'Whether a confirmation locked this save. Derived, never stored — confirming writes no values, so it is no revision of its own.'
          type: boolean
      type: object
      additionalProperties: false
    FormHistory:
      description: 'Every accepted save of one form, newest first.'
      required:
        - revisions
      properties:
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/FormRevision'
      type: object
      additionalProperties: false
    FormEnvelope:
      description: 'The canonical JSON shape of a form read back from the API.'
      required:
        - id
        - status
        - expireDate
        - createdAt
        - definition
        - data
        - dataSavedAt
        - revision
        - confirmedAt
        - createdNotifiedAt
        - confirmNotifiedAt
        - identity
        - author
        - confirmedBy
        - webhooks
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/FormStatus'
        expireDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        definition:
          $ref: '#/components/schemas/FormDefinition'
        data:
          oneOf:
            -
              $ref: '#/components/schemas/FormValues'
            -
              type: 'null'
        dataSavedAt:
          type:
            - string
            - 'null'
          format: date-time
        revision:
          description: 'How many saves this form has accepted, which is the number of its newest one; 0 for a form nobody has filled in. Hand it back in `If-Match` on `PUT /api/forms/{id}/data` or `POST /api/forms/{id}/confirm` to be refused with 412 rather than replace a document somebody saved in between. The same number is the `ETag` of `GET /api/forms/{id}/data`.'
          type: integer
          minimum: 0
        confirmedAt:
          type:
            - string
            - 'null'
          format: date-time
        createdNotifiedAt:
          description: 'When this form told whoever it names that it exists. Null while it has not been told — not yet, given up on, or a form that reports nowhere. On the form because a creation is no revision.'
          type:
            - string
            - 'null'
          format: date-time
        confirmNotifiedAt:
          description: 'When this form told whoever owns it that it had been confirmed. Null while it has not been told — not yet, given up on, or a form that reports nowhere. On the form rather than on a revision because confirming writes no values and is no revision.'
          type:
            - string
            - 'null'
          format: date-time
        identity:
          description: 'Whether this form records who fills it in. Given at creation and immutable. `anonymous` discards an asserted identity rather than refusing it, so a gateway asserting on every request cannot build a record by accident.'
          type: string
          enum:
            - recorded
            - anonymous
        author:
          description: 'Who created this form — an opaque subject as whatever authenticated the caller said it, never resolved into a person here. Null when nobody was asserted. Outside `identity` on purpose: an anonymous form still has an author, because somebody created it.'
          type:
            - string
            - 'null'
          maxLength: 255
        confirmedBy:
          description: 'Who locked this form. Its own member because confirming writes no values and is therefore no revision — without it, the most consequential act on a form would be the one nobody attributed. Null while the form is open, and on an anonymous form.'
          type:
            - string
            - 'null'
          maxLength: 255
        webhooks:
          $ref: '#/components/schemas/FormWebhooks'
      type: object
      additionalProperties: false
    FormWebhooks:
      description: "Where this form reports what happens to it, as it was given at creation and for the life of the form. The members are independent and any may be null, which means nobody is told about that event. What arrives there is a notification and never the values — `{event, form, occurredAt, revision?, actor?}` — signed with this deployment's secret in `X-Forms-Signature`, and carrying `X-Forms-Delivery` so a receiver can recognise a retry of one it already acted on."
      required:
        - created
        - save
        - confirm
        - deleted
      properties:
        created:
          description: 'Told when the form comes into being. Whoever creates a form is handed its id in the response, so this is for a receiver that is not the creator: without it, a downstream mirroring these forms meets one for the first time as a `form.saved` for an id it has never seen.'
          type:
            - string
            - 'null'
          format: uri
          maxLength: 2000
        save:
          description: 'Told when a draft save is accepted, with the revision it became.'
          type:
            - string
            - 'null'
          format: uri
          maxLength: 2000
        confirm:
          description: 'Told when the form is confirmed. A confirmation is no revision, so it carries none.'
          type:
            - string
            - 'null'
          format: uri
          maxLength: 2000
        deleted:
          description: 'Told when the form stops existing, with `reason` saying which way: `requested` when somebody deleted it, `expired` when the purge reaped it. The second is what this endpoint is really for — nobody asks the purge for anything, so there is no other way to learn it.'
          type:
            - string
            - 'null'
          format: uri
          maxLength: 2000
      type: object
      additionalProperties: false
    ProblemError:
      description: "One validation error, mapped 1:1 from the engine's report or a constraint violation."
      required:
        - pointer
        - code
        - message
      properties:
        pointer:
          description: 'RFC 6901 JSON Pointer into the offending document ("" is its root).'
          type: string
        code:
          description: 'Machine-readable code, e.g. `schema.required`, `request.range` or `form.field.duplicate-name`.'
          type: string
        message:
          type: string
        input:
          description: 'The offending value — echoed only when it is a scalar.'
          type:
            - string
            - number
            - boolean
      type: object
      additionalProperties: false
    Problem:
      description: 'RFC 9457 problem details. `type` is a URN `urn:problem:ingot-forms:<slug>`; validation problems carry the `errors` extension member.'
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ProblemError'
      type: object
      additionalProperties: false
    CreateFormRequest:
      required:
        - expireDate
        - definition
      properties:
        expireDate:
          description: 'When the form stops being fillable, as an RFC 3339 date-time. Must lie in the future; past it the form answers 410 everywhere and the purge command deletes it.'
          type: string
          format: date-time
          example: '2030-01-31T23:59:59+00:00'
        definition:
          description: 'The form definition: 1–1000 typed items with unique names, per the meta-schema this API serves at `GET /api/schemas/definition`. Immutable once created — changing it means deleting the form and creating a new one.'
          minProperties: 1
          type: object
          example:
            items:
              -
                type: text
                name: email
                required: true
        presentation:
          description: 'How the form is shown, per the meta-schema this API serves at `GET /api/schemas/presentation`. Optional — a client that draws forms its own way needs none. May name a "skin" the engine offers, which changes how the page looks and never what the document may say; a deployment default dresses whatever names none. Immutable with the definition: changing either means deleting the form and creating a new one.'
          type:
            - object
            - 'null'
          example:
            engine: core-html
            items:
              -
                name: email
                widget: text
                label: contact.email
          default: null
        data:
          description: "What the form already holds, keyed by item name — for values a client knows before anybody opens the form. Optional. Judged against this form's own definition under the *draft* contract, so an incomplete document is fine and `required` items may be left out; a value that breaks its item's rules is reported at `/data/<item>`. A form created with this is born a draft: it can be filled in further, and confirmed when it is complete."
          type:
            - object
            - 'null'
          example:
            email: ada@example.com
          default: null
        identity:
          description: 'Whether this form records who fills it in. `recorded` (the default) stores the identity a gateway asserted with every accepted save, and refuses a save that can name nobody. `anonymous` stores nobody — and *discards* an asserted identity rather than refusing it, so a deployment whose proxy asserts on every request cannot build a record by accident. Immutable, like the definition. There is deliberately no third value: an "optional" mode would make one column mean both "nobody was there" and "somebody was and did not say".'
          type: string
          example: recorded
          default: recorded
          enum:
            - recorded
            - anonymous
        webhooks:
          description: "Where this form reports what happens to it. All members are optional and independent: `created` is told when the form comes into being (for a receiver that is not whoever created it), `save` when a draft save was accepted, `confirm` when the form was confirmed, `deleted` when it stops existing (deleted, or reaped for having expired — the notification says which in `reason`). What arrives there is a notification and never the values — `{event, form, occurredAt, revision?, actor?}` — so a receiver reads the document through this API, signed with this deployment's secret in `X-Forms-Signature`. Immutable with the definition: changing where a form reports means deleting it and creating a new one. Omit it, or omit either member, and nobody is told."
          type:
            - object
            - 'null'
          example:
            confirm: 'https://example.test/forms/confirmed'
          default: null
      type: object
      additionalProperties: false
    DataSchemaQuery:
      properties:
        mode:
          description: 'Which contract the returned schema enforces: `strict` is the confirmation contract, `draft` relaxes what would block storing partial progress.'
          type: string
          example: draft
          default: strict
          enum:
            - strict
            - draft
      type: object
    stdClass:
      type: object
    SaveFormDataRequest:
      required:
        - values
      properties:
        values:
          $ref: '#/components/schemas/stdClass'
      type: object
  responses:
    MalformedJson:
      description: 'The request body is not valid JSON, or its media type is missing.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            malformed-json:
              summary: 'Unparsable body'
              value:
                type: 'urn:problem:ingot-forms:malformed-json'
                title: 'Request body is not valid JSON.'
                status: 400
    UnsupportedMediaType:
      description: 'The request body is not `application/json` — no other media type is accepted.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unsupported-media-type:
              summary: 'A form-encoded or missing content type'
              value:
                type: 'urn:problem:ingot-forms:unsupported-media-type'
                title: 'Only application/json request bodies are accepted.'
                status: 415
    FormNotFound:
      description: 'No form with this id.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            form-not-found:
              summary: 'Unknown id'
              value:
                type: 'urn:problem:ingot-forms:form-not-found'
                title: 'Form not found.'
                status: 404
    FormGone:
      description: 'The form has expired; its data is scheduled for physical deletion.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            form-gone:
              summary: 'Past its expire date'
              value:
                type: 'urn:problem:ingot-forms:form-gone'
                title: 'Form has expired.'
                status: 410

